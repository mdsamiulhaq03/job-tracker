<svg viewBox="0 0 168 44" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jotion">
  <!-- Briefcase body -->
  <rect x="4" y="16" width="36" height="24" rx="5" fill="#4F46E5"/>
  <!-- Handle -->
  <rect x="13" y="6" width="18" height="14" rx="5" fill="none" stroke="#4F46E5" stroke-width="4" stroke-linejoin="round"/>
  <!-- Divider line -->
  <line x1="4" y1="28" x2="40" y2="28" stroke="#7C75F5" stroke-width="2"/>
  <!-- Clasp -->
  <rect x="16" y="23" width="12" height="10" rx="3" fill="#7C75F5"/>
  <!-- Checkmark -->
  <polyline points="18.5,28 21,30.5 25.5,24.5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text
    x="52" y="32"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="26"
    font-weight="600"
    letter-spacing="-0.5"
    fill="#E0E0E0"
  >Jotion</text>
</svg>
